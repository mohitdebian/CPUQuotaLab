[package]
name = "cpu-quota-lab"
version = "0.1.0"
edition = "2024"
description = "Experimental instrument for studying native worker pools under Linux CPU quotas"
license = "MIT"

[dependencies]
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

